<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>ChefMii Prototype: Book a West African private chef in London</title>
<meta name="description" content="ChefMii prototype. Watch West African chefs cook, then book them for your celebration in London.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Text:wght@400;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--coral:#F04E37;--coral-d:#D63E28;--ink:#1C1C1E;--muted:#6B6B70;--soft:#FFF7F4;--line:#EEE4E0;--gold:#F4A227;--green:#1E8E5A}
*{box-sizing:border-box}html,body{margin:0}
body{font-family:Roboto,system-ui,sans-serif;color:var(--ink);background:#fff;line-height:1.5}
h1,h2,h3{font-family:'Libre Caslon Text',Georgia,serif;line-height:1.2;margin:0 0 .5rem}
a{color:var(--coral)}
.wrap{max-width:1080px;margin:0 auto;padding:0 18px}
.proto{background:var(--ink);color:#fff;font-size:13px;text-align:center;padding:6px 10px}
header{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line)}
.nav{display:flex;align-items:center;justify-content:space-between;height:60px}
.logo{font-family:'Libre Caslon Text',serif;font-weight:700;font-size:22px;color:var(--ink);text-decoration:none}
.logo span{color:var(--coral)}
.nav nav a{margin-left:14px;color:var(--ink);text-decoration:none;font-size:14px;font-weight:500}
.nav nav a.active{color:var(--coral)}
.btn{display:inline-block;border:0;border-radius:999px;padding:12px 22px;font:500 15px Roboto,sans-serif;cursor:pointer;text-decoration:none;text-align:center}
.btn-p{background:var(--coral);color:#fff}.btn-p:hover{background:var(--coral-d)}
.btn-o{background:#fff;color:var(--ink);border:1.5px solid var(--ink)}
.btn-g{background:#25D366;color:#fff}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.hero{background:var(--soft);padding:48px 0 40px}
.hero h1{font-size:clamp(30px,5vw,46px)}
.hero p.lead{font-size:18px;color:var(--muted);max-width:560px}
.hero .cta{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
section{padding:40px 0}
.grid{display:grid;gap:16px}
.g3{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.step{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px}
.step b{display:inline-flex;width:30px;height:30px;border-radius:50%;background:var(--coral);color:#fff;align-items:center;justify-content:center;margin-bottom:8px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);border-radius:999px;padding:7px 14px;font-size:14px;background:#fff;cursor:pointer}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.card{border:1px solid var(--line);border-radius:16px;overflow:hidden;background:#fff;cursor:pointer;transition:box-shadow .2s;text-decoration:none;color:inherit;display:block}
.card:hover{box-shadow:0 8px 24px rgba(0,0,0,.08)}
.thumb{aspect-ratio:4/3;position:relative;display:flex;align-items:flex-end;padding:12px;color:#fff;font-weight:700}
.thumb .play{position:absolute;inset:0;margin:auto;width:56px;height:56px;border-radius:50%;background:rgba(255,255,255,.9);display:flex;align-items:center;justify-content:center}
.thumb .play:after{content:"";border-left:16px solid var(--coral);border-top:10px solid transparent;border-bottom:10px solid transparent;margin-left:4px}
.badge{position:absolute;top:10px;left:10px;background:#fff;color:var(--green);font-size:12px;font-weight:700;border-radius:999px;padding:4px 10px}
.demo{position:absolute;top:10px;right:10px;background:var(--ink);color:#fff;font-size:11px;border-radius:999px;padding:3px 8px}
.cbody{padding:14px}
.cbody .meta{color:var(--muted);font-size:14px}
.price{font-weight:700}.price span{color:var(--coral)}
.star{color:var(--gold)}
.profile{display:grid;grid-template-columns:1fr;gap:24px}
@media(min-width:860px){.profile{grid-template-columns:360px 1fr}}
.video{border-radius:18px;aspect-ratio:9/16;max-height:560px;width:100%;position:relative;overflow:hidden;display:flex;align-items:flex-end;padding:16px;color:#fff}
.video .cap{background:rgba(0,0,0,.45);border-radius:10px;padding:8px 10px;font-size:14px}
.steam{position:absolute;left:50%;top:30%;width:8px;height:60px;border-radius:8px;background:rgba(255,255,255,.5);animation:steam 2.4s infinite ease-in-out}
.steam.s2{left:44%;animation-delay:.6s}.steam.s3{left:56%;animation-delay:1.2s}
@keyframes steam{0%{transform:translateY(20px) scaleY(.6);opacity:0}50%{opacity:.8}100%{transform:translateY(-40px) scaleY(1.2);opacity:0}}
.menu{border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}
.menu.sel{border-color:var(--coral);box-shadow:0 0 0 2px var(--coral) inset}
.menu ul{margin:6px 0 0 18px;padding:0;color:var(--muted)}
.checks{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.ok{background:#E8F6EE;color:var(--green);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:500}
form .row{display:grid;gap:12px;grid-template-columns:1fr}
@media(min-width:640px){form .row.two{grid-template-columns:1fr 1fr}}
label{font-size:14px;font-weight:500;display:block;margin-bottom:4px}
input,select,textarea{width:100%;padding:11px 12px;border:1px solid #D9CFCB;border-radius:10px;font:15px Roboto,sans-serif;background:#fff}
textarea{min-height:80px}
.consent{display:flex;gap:8px;align-items:flex-start;font-size:14px;background:var(--soft);padding:10px;border-radius:10px}
.consent input{width:auto;margin-top:3px}
.summary{background:var(--soft);border-radius:16px;padding:18px;position:sticky;top:76px}
.summary .line{display:flex;justify-content:space-between;margin:6px 0}
.summary .total{font-size:20px;font-weight:700;border-top:1px solid var(--line);padding-top:8px}
.split{display:grid;gap:24px;grid-template-columns:1fr}
@media(min-width:860px){.split{grid-template-columns:1fr 340px}}
.note{font-size:13px;color:var(--muted)}
.done{text-align:center;max-width:560px;margin:0 auto}
.done .tick{width:70px;height:70px;border-radius:50%;background:#E8F6EE;color:var(--green);font-size:38px;display:flex;align-items:center;justify-content:center;margin:0 auto 12px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:10px;border-bottom:1px solid var(--line);vertical-align:top}
th{background:var(--soft)}
.faq details{border-bottom:1px solid var(--line);padding:12px 0}
.faq summary{cursor:pointer;font-weight:500}
footer{background:var(--ink);color:#ccc;padding:28px 0;font-size:14px;margin-top:30px}
footer a{color:#fff}
.wa{position:fixed;right:16px;bottom:16px;width:56px;height:56px;border-radius:50%;background:#25D366;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 18px rgba(0,0,0,.2);z-index:30}
.wa svg{width:30px;height:30px;fill:#fff}
.sticky-book{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:10px 16px;display:flex;justify-content:space-between;align-items:center;z-index:25}
@media(min-width:860px){.sticky-book{display:none}}
@media(max-width:859px){body.has-sticky .wa{bottom:76px}}
.empty{padding:30px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:14px}
</style>
</head>
<body>
<div class="proto">Prototype for testing. Chefs shown are demo profiles. No real bookings or payments are taken.</div>
<header><div class="wrap nav">
  <a class="logo" href="#/">Chef<span>Mii</span></a>
  <nav><a href="#/chefs" data-r="chefs">Chefs</a><a href="#/request" data-r="request">Request</a><a href="#/join" data-r="join">For chefs</a></nav>
</div></header>
<main id="app"></main>
<footer><div class="wrap">
  <p><b style="color:#fff">ChefMii</b>: West African private chefs for home celebrations in London. Watch them cook, then book them.</p>
  <p>Prototype v0.1 · <a href="#/privacy">Privacy</a> · <a href="#/admin">Founder view</a> · Contact: <a href="https://wa.me/447551674140">WhatsApp</a></p>
</div></footer>
<a class="wa" id="waFloat" target="_blank" rel="noopener" aria-label="Chat on WhatsApp"><svg viewBox="0 0 32 32"><path d="M16 3a13 13 0 0 0-11.2 19.6L3 29l6.6-1.7A13 13 0 1 0 16 3zm0 23.6c-2 0-3.9-.5-5.6-1.5l-.4-.2-3.9 1 1-3.8-.3-.4A10.6 10.6 0 1 1 16 26.6zm5.8-7.9c-.3-.2-1.9-.9-2.2-1s-.5-.2-.7.2-.8 1-1 1.2-.4.2-.7.1a8.7 8.7 0 0 1-4.3-3.8c-.3-.6.3-.5 1-1.7.1-.2 0-.4 0-.5l-1-2.4c-.3-.6-.5-.5-.7-.5h-.6a1.2 1.2 0 0 0-.9.4 3.6 3.6 0 0 0-1.1 2.7 6.3 6.3 0 0 0 1.3 3.3 14.3 14.3 0 0 0 5.5 4.8c2 .9 2.8.9 3.8.8a3.3 3.3 0 0 0 2.2-1.5 2.7 2.7 0 0 0 .2-1.5c-.1-.2-.3-.3-.6-.4z"/></svg></a>

<script>
const WA = '447551674140';
const CHEF_FORM = 'https://docs.google.com/forms/d/e/1FAIpQLSfwKH4BPHk4PS9OFk5tmeU3t1C-YFD4oieRsf6PxRnTDeTtQQ/viewform';
const FEE = 0.15;
const G = ['linear-gradient(135deg,#F04E37,#F4A227)','linear-gradient(135deg,#7A2E1D,#F04E37)','linear-gradient(135deg,#1E8E5A,#F4A227)','linear-gradient(135deg,#3B2A20,#C8642B)','linear-gradient(135deg,#B8321F,#5A1A10)'];
const CHEFS = [
 {id:'ama',name:'Chef Ama',cuisine:'Ghanaian',area:'East London',rating:4.9,reviews:23,min:10,bio:'Grew up cooking for family gatherings in Kumasi. Known for smoky party jollof, kelewele and fresh shito. Cooks for naming ceremonies and birthdays across East London.',dishes:['Party jollof','Waakye','Kelewele','Grilled tilapia'],
  menus:[{n:'Naming Ceremony Feast',p:32,items:['Small chops: puff-puff, spring rolls, chicken wings','Ghanaian party jollof with grilled chicken','Kelewele and fried plantain','Shito and fresh salad']},{n:'Waakye Sunday Spread',p:28,items:['Waakye with gari, spaghetti and boiled egg','Beef and fish stew','Fried plantain','Shito on the side']}]},
 {id:'tunde',name:'Chef Tunde',cuisine:'Nigerian',area:'South London',rating:4.8,reviews:31,min:15,bio:'Former restaurant chef in Lagos and London. Brings the full owambe experience: suya station, pounded yam and rich soups, served hot at your home.',dishes:['Suya','Pounded yam and egusi','Asun','Ofada rice'],
  menus:[{n:'Owambe Birthday Party',p:38,items:['Live suya station with onions and yaji','Smoky Nigerian jollof and fried rice','Asun (spicy goat)','Dodo and moi moi']},{n:'Swallow and Soup Night',p:34,items:['Pounded yam and amala','Egusi and efo riro','Assorted meat and fish','Zobo to drink']}]},
 {id:'fatmata',name:'Chef Fatmata',cuisine:'Sierra Leonean',area:'East London',rating:5.0,reviews:9,min:8,bio:'Home-style Salone cooking with a modern touch. Cassava leaf, groundnut soup and the best fry-fry in London for intimate celebrations.',dishes:['Cassava leaf','Groundnut soup','Jollof','Ginger beer'],
  menus:[{n:'Salone Family Table',p:30,items:['Cassava leaf with rice','Groundnut soup with chicken','Fried plantain and fish','Homemade ginger beer']}]},
 {id:'kofi',name:'Chef Kofi',cuisine:'Ghanaian and Nigerian',area:'North London',rating:4.7,reviews:14,min:12,bio:'Trained chef who mixes Ghanaian and Nigerian classics. Popular for engagements and graduation parties where both families need to feel at home.',dishes:['Jollof (both ways)','Banku and tilapia','Suya wings','Chin chin'],
  menus:[{n:'Two Families Engagement Menu',p:42,items:['Ghanaian and Nigerian jollof side by side','Banku with grilled tilapia','Suya chicken wings','Chin chin and fruit platter']},{n:'Graduation Buffet',p:29,items:['Fried rice and jollof','Peppered chicken','Coleslaw and plantain','Meat pies']}]},
 {id:'adaeze',name:'Chef Adaeze',cuisine:'Nigerian',area:'West London',rating:4.9,reviews:18,min:10,bio:'Igbo kitchen specialist. Ofe onugbu, nkwobi and abacha for Christmas and family celebrations, plus vegetarian options on request.',dishes:['Nkwobi','Ofe onugbu','Abacha','Vegetable stew'],
  menus:[{n:'Igbo Christmas Feast',p:40,items:['Nkwobi starter','Ofe onugbu with fufu','Jollof with turkey','Abacha salad']}]}
];
const OCC = ['Birthday','Naming ceremony','Engagement','Graduation','Christmas or New Year','Other'];
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money = n => '£' + n.toLocaleString('en-GB',{minimumFractionDigits:0,maximumFractionDigits:2});
const store = {
  get(){ try{ return JSON.parse(localStorage.getItem('chefmii_requests')||'[]'); }catch(e){ return mem; } },
  set(v){ mem=v; try{ localStorage.setItem('chefmii_requests',JSON.stringify(v)); }catch(e){} }
}; let mem=[];
const from = c => Math.min(...c.menus.map(m=>m.p));
const grad = i => G[i % G.length];
document.getElementById('waFloat').href = 'https://wa.me/'+WA+'?text='+encodeURIComponent("Hi ChefMii, I'd like to book a chef");

function chefCard(c,i){
  return `<a class="card" href="#/chef/${c.id}">
    <div class="thumb" style="background:${grad(i)}"><span class="badge">Verified</span><span class="demo">Demo</span><span class="play"></span><span>${esc(c.dishes[0])}</span></div>
    <div class="cbody"><div style="display:flex;justify-content:space-between"><h3 style="font-size:19px">${esc(c.name)}</h3><span><span class="star">★</span> ${c.rating.toFixed(1)} <span class="meta">(${c.reviews})</span></span></div>
    <div class="meta">${esc(c.cuisine)} · ${esc(c.area)}</div>
    <div class="price" style="margin-top:6px">From <span>${money(from(c))}</span> per guest · min ${c.min} guests</div></div></a>`;
}

function home(){
  return `<div class="hero"><div class="wrap">
    <h1>Book a West African private chef for your next celebration</h1>
    <p class="lead">Watch them cook, then book them. Verified chefs who shop, cook, serve and clean up at your home. London only, for now.</p>
    <div class="cta"><a class="btn btn-p" href="#/chefs">Browse chefs</a><a class="btn btn-o" href="#/request">Request a chef</a></div>
    <div class="chips" style="margin-top:22px">${OCC.slice(0,5).map(o=>`<span class="chip">${o}</span>`).join('')}</div>
  </div></div>
  <section><div class="wrap"><h2>How it works</h2><div class="grid g3" style="margin-top:14px">
    <div class="step"><b>1</b><h3 style="font-size:18px">Watch chefs cook</h3><p class="note">Every chef has short cooking videos, set menus and clear prices per guest.</p></div>
    <div class="step"><b>2</b><h3 style="font-size:18px">Send your event details</h3><p class="note">Date, guests, postcode and any dietary needs. Takes 2 minutes.</p></div>
    <div class="step"><b>3</b><h3 style="font-size:18px">We confirm in 24 hours</h3><p class="note">We confirm your chef and quote on WhatsApp. Payment is held until after your event.</p></div>
  </div></div></section>
  <section style="background:var(--soft)"><div class="wrap"><div style="display:flex;justify-content:space-between;align-items:end"><h2>Featured chefs</h2><a href="#/chefs">See all</a></div>
    <div class="grid g3" style="margin-top:14px">${CHEFS.slice(0,3).map(chefCard).join('')}</div></div></section>
  <section><div class="wrap"><h2>Why ChefMii</h2><div class="grid g3" style="margin-top:14px">
    <div class="step"><h3 style="font-size:18px">Authentic food</h3><p class="note">Only West African chefs: Nigerian, Ghanaian, Sierra Leonean and more.</p></div>
    <div class="step"><h3 style="font-size:18px">Checked and insured</h3><p class="note">ID verified, food hygiene and allergen trained, registered with their council, insured.</p></div>
    <div class="step"><h3 style="font-size:18px">Fair to chefs</h3><p class="note">Chefs keep 100% of their price. You pay a small booking fee.</p></div>
  </div></div></section>
  <section class="faq"><div class="wrap" style="max-width:760px"><h2>Questions</h2>
    <details><summary>How much does it cost?</summary><p class="note">Chefs set a price per guest, usually £28 to £42 for party menus. ChefMii adds a 15% booking fee. You see the full price before you pay.</p></details>
    <details><summary>Which areas do you cover?</summary><p class="note">All London boroughs for now.</p></details>
    <details><summary>Can you cater for allergies and dietary needs?</summary><p class="note">Yes. Tell us on the request form. We share it only with your chef and delete it 30 days after your event.</p></details>
    <details><summary>How does payment work?</summary><p class="note">We confirm the quote with you first. Payment is held and released to the chef after your event.</p></details>
  </div></section>`;
}

let filt = {cuisine:'All',area:'All'};
function chefs(){
  const cu = ['All','Nigerian','Ghanaian','Sierra Leonean'], ar = ['All','East London','South London','North London','West London'];
  const list = CHEFS.filter(c => (filt.cuisine==='All'||c.cuisine.includes(filt.cuisine)) && (filt.area==='All'||c.area===filt.area));
  return `<section><div class="wrap"><h1>West African chefs in London</h1>
    <p class="note">Filter by cuisine and area. Tap a chef to watch them cook and see menus.</p>
    <div class="chips" style="margin:12px 0">${cu.map(x=>`<button class="chip ${filt.cuisine===x?'on':''}" onclick="filt.cuisine='${x}';render()">${x}</button>`).join('')}</div>
    <div class="chips" style="margin-bottom:18px">${ar.map(x=>`<button class="chip ${filt.area===x?'on':''}" onclick="filt.area='${x}';render()">${x}</button>`).join('')}</div>
    <div class="grid g3">${list.length?list.map(c=>chefCard(c,CHEFS.indexOf(c))).join(''):'<div class="empty">No chefs match yet. <a href="#/request">Send a request</a> and we will find one for you.</div>'}</div>
  </div></section>`;
}

function chef(id){
  const c = CHEFS.find(x=>x.id===id); if(!c) return '<section><div class="wrap empty">Chef not found. <a href="#/chefs">Back to chefs</a></div></section>';
  const i = CHEFS.indexOf(c);
  return `<section><div class="wrap profile">
    <div><div class="video" style="background:${grad(i)}"><span class="steam"></span><span class="steam s2"></span><span class="steam s3"></span><span class="demo">Demo</span>
      <div class="cap">${esc(c.name)} cooking ${esc(c.dishes[0].toLowerCase())}. Real cooking clips will play here.</div></div></div>
    <div><a href="#/chefs" class="note">← All chefs</a>
      <h1 style="margin-top:6px">${esc(c.name)}</h1>
      <div class="meta">${esc(c.cuisine)} · ${esc(c.area)} · <span class="star">★</span> ${c.rating.toFixed(1)} (${c.reviews} reviews)</div>
      <div class="checks"><span class="ok">✓ ID verified</span><span class="ok">✓ Food hygiene trained</span><span class="ok">✓ Allergen trained</span><span class="ok">✓ Insured</span></div>
      <p>${esc(c.bio)}</p>
      <p class="note"><b>Signature dishes:</b> ${c.dishes.map(esc).join(', ')}</p>
      <h2 style="font-size:22px;margin-top:18px">Set menus</h2>
      ${c.menus.map((m,k)=>`<div class="menu"><div style="display:flex;justify-content:space-between;gap:10px"><h3 style="font-size:18px">${esc(m.n)}</h3><span class="price"><span>${money(m.p)}</span> / guest</span></div>
        <ul>${m.items.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>
        <a class="btn btn-p" style="margin-top:12px;padding:9px 18px" href="#/request?chef=${c.id}&menu=${k}">Request this menu</a></div>`).join('')}
      <p class="note">Minimum ${c.min} guests. Price includes shopping, cooking, serving and clean-up.</p>
    </div></div></section>
    <div class="sticky-book"><div><b>${esc(c.name)}</b><div class="note">From ${money(from(c))} / guest</div></div><a class="btn btn-p" href="#/request?chef=${c.id}&menu=0">Request</a></div>`;
}

function requestPage(q){
  const today = new Date(); today.setDate(today.getDate()+3); const minD = today.toISOString().slice(0,10);
  return `<section><div class="wrap"><h1>Request a chef</h1><p class="note">Tell us about your celebration. We reply on WhatsApp within 24 hours with your chef and quote. No payment now.</p>
  <div class="split" style="margin-top:16px"><form id="rf" novalidate>
    <div class="row two"><div><label>Chef</label><select name="chef" id="fChef"><option value="">Match me with a chef</option>${CHEFS.map(c=>`<option value="${c.id}" ${q.chef===c.id?'selected':''}>${esc(c.name)} (${esc(c.cuisine)})</option>`).join('')}</select></div>
      <div><label>Menu</label><select name="menu" id="fMenu"></select></div></div>
    <div class="row two" style="margin-top:12px"><div><label>Occasion</label><select name="occasion">${OCC.map(o=>`<option>${o}</option>`).join('')}</select></div>
      <div><label>Event date</label><input type="date" name="date" min="${minD}" required></div></div>
    <div class="row two" style="margin-top:12px"><div><label>Number of guests: <b id="gOut">20</b></label><input type="range" name="guests" id="fGuests" min="8" max="60" value="20"></div>
      <div><label>London postcode</label><input name="postcode" placeholder="e.g. E15 1AA" required maxlength="9"></div></div>
    <div style="margin-top:12px"><label>Dietary needs or allergies (optional)</label><textarea name="dietary" id="fDiet" placeholder="e.g. 2 guests are vegetarian, 1 has a peanut allergy"></textarea></div>
    <div class="consent" id="consentBox" style="margin-top:8px;display:none"><input type="checkbox" id="fConsent"><span>I agree that ChefMii can use this allergy and dietary information to plan my menu and share it only with my booked chef. It is deleted 30 days after my event.</span></div>
    <div class="row two" style="margin-top:12px"><div><label>Your name</label><input name="name" required maxlength="60"></div>
      <div><label>WhatsApp number</label><input name="phone" type="tel" required placeholder="07..." maxlength="16"></div></div>
    <div style="margin-top:12px"><label>Anything else?</label><textarea name="notes" placeholder="Timing, kitchen size, serving style..."></textarea></div>
    <p class="note">By sending, you agree to our <a href="#/privacy">privacy notice</a>.</p>
    <p id="err" style="color:var(--coral-d);font-weight:500"></p>
    <button class="btn btn-p" type="submit" style="width:100%">Send request</button>
  </form>
  <aside><div class="summary"><h3 style="font-size:18px">Price estimate</h3><div id="sum"></div><p class="note" style="margin-top:10px">Estimate only. Your chef confirms the final quote. Payment is held until after your event.</p></div></aside>
  </div></div></section>`;
}
function bindRequest(q){
  const fc=$('#fChef'), fm=$('#fMenu'), fg=$('#fGuests'), fd=$('#fDiet');
  const fillMenus=()=>{const c=CHEFS.find(x=>x.id===fc.value); fm.innerHTML = c ? c.menus.map((m,k)=>`<option value="${k}">${esc(m.n)} (${money(m.p)}/guest)</option>`).join('') : '<option value="">Chef will suggest a menu</option>'; if(c && q.menu && c.menus[q.menu]) fm.value=q.menu; q.menu=null; calc();};
  const calc=()=>{const c=CHEFS.find(x=>x.id===fc.value), g=+fg.value; $('#gOut').textContent=g;
    if(!c){ $('#sum').innerHTML = `<div class="line"><span>Typical price</span><span>£28 to £42 / guest</span></div><div class="line"><span>Guests</span><span>${g}</span></div><div class="line total"><span>Estimate</span><span>${money(g*28*1.15)} to ${money(g*42*1.15)}</span></div>`; return; }
    const m=c.menus[+fm.value||0], chefP=g*m.p, fee=Math.round(chefP*FEE*100)/100;
    $('#sum').innerHTML = `<div class="line"><span>${esc(m.n)}</span></div><div class="line"><span>${g} guests × ${money(m.p)}</span><span>${money(chefP)}</span></div><div class="line"><span>ChefMii booking fee (15%)</span><span>${money(fee)}</span></div><div class="line total"><span>Total</span><span>${money(chefP+fee)}</span></div>${g<c.min?`<p class="note" style="color:var(--coral-d)">${esc(c.name)} needs at least ${c.min} guests.</p>`:''}`;};
  fc.onchange=fillMenus; fm.onchange=calc; fg.oninput=calc;
  fd.oninput=()=>{$('#consentBox').style.display = fd.value.trim() ? 'flex' : 'none';};
  fillMenus();
  $('#rf').onsubmit=e=>{e.preventDefault(); const f=new FormData(e.target), d=Object.fromEntries(f.entries());
    const err=[]; if(!d.date) err.push('event date'); if(!/^[A-Za-z]{1,2}\d/.test((d.postcode||'').trim())) err.push('a London postcode'); if(!d.name.trim()) err.push('your name'); if(!/^[+0-9 ]{10,16}$/.test(d.phone.trim())) err.push('a valid WhatsApp number');
    if(d.dietary.trim() && !$('#fConsent').checked) err.push('consent for allergy information');
    if(err.length){ $('#err').textContent='Please add '+err.join(', ')+'.'; return; }
    const c=CHEFS.find(x=>x.id===d.chef), m=c?c.menus[+d.menu||0]:null, g=+d.guests;
    const r={id:'CM-'+Date.now().toString(36).toUpperCase().slice(-6),created:new Date().toISOString(),status:'New',chef:c?c.name:'Match me',menu:m?m.n:'',guests:g,occasion:d.occasion,date:d.date,postcode:d.postcode.toUpperCase(),dietary:d.dietary,name:d.name,phone:d.phone,notes:d.notes,estimate:m?Math.round(g*m.p*(1+FEE)):null};
    const all=store.get(); all.unshift(r); store.set(all);
    location.hash='#/done/'+r.id;};
}
function done(id){
  const r=store.get().find(x=>x.id===id)||mem.find(x=>x.id===id);
  if(!r) return '<section><div class="wrap empty">Request not found. <a href="#/request">Start again</a></div></section>';
  const txt=`Hi ChefMii, I've sent request ${r.id}.\nOccasion: ${r.occasion}\nDate: ${r.date}\nGuests: ${r.guests}\nPostcode: ${r.postcode}\nChef: ${r.chef}${r.menu?' ('+r.menu+')':''}${r.estimate?'\nEstimate: '+money(r.estimate):''}\nName: ${r.name}`;
  return `<section><div class="wrap done"><div class="tick">✓</div><h1>Request sent</h1>
    <p>Thanks ${esc(r.name)}! Your reference is <b>${r.id}</b>. Jo will WhatsApp you within 24 hours with your chef and quote.</p>
    <p class="note">For a faster reply, send your request on WhatsApp now:</p>
    <a class="btn btn-g" target="_blank" rel="noopener" href="https://wa.me/${WA}?text=${encodeURIComponent(txt)}">Send on WhatsApp</a>
    <p style="margin-top:18px"><a href="#/chefs">Browse more chefs</a></p></div></section>`;
}
function join(){
  return `<div class="hero"><div class="wrap"><h1>Get booked for parties in London</h1>
    <p class="lead">Join ChefMii as a founding chef. Free verified profile, we film your cooking, and you keep 100% of your price.</p>
    <div class="cta"><a class="btn btn-p" target="_blank" rel="noopener" href="${CHEF_FORM}">Apply as a founding chef (3 min)</a><a class="btn btn-o" target="_blank" rel="noopener" href="https://wa.me/${WA}?text=${encodeURIComponent("Hi Jo, I'm a chef and I'd like to join ChefMii")}">Ask Jo on WhatsApp</a></div></div></div>
  <section><div class="wrap"><h2>What you get</h2><div class="grid g3" style="margin-top:14px">
    <div class="step"><h3 style="font-size:18px">Keep 100% of your price</h3><p class="note">The host pays the ChefMii booking fee, not you.</p></div>
    <div class="step"><h3 style="font-size:18px">Free filming and profile</h3><p class="note">We film 2 short cooking clips and set up your menus and prices.</p></div>
    <div class="step"><h3 style="font-size:18px">Paid and protected</h3><p class="note">Payment is taken upfront and paid to you within 48 hours of the event.</p></div>
  </div></div></section>
  <section style="background:var(--soft)"><div class="wrap"><h2>How we verify chefs</h2><p class="note">We check everything and keep as little as possible. We never keep copies of your ID.</p>
  <table style="margin-top:12px;background:#fff;border-radius:12px;overflow:hidden"><tr><th>Step</th><th>What happens</th><th>Time</th></tr>
  <tr><td>1. Apply</td><td>Fill in the short form</td><td>3 min</td></tr>
  <tr><td>2. Call</td><td>15-minute WhatsApp video call with Jo</td><td>15 min</td></tr>
  <tr><td>3. ID check</td><td>Show photo ID on the call. We record that it was checked, not a copy</td><td>5 min</td></tr>
  <tr><td>4. Food safety</td><td>Council food business registration, food hygiene training, allergen training (the free FSA course is fine)</td><td>10 min</td></tr>
  <tr><td>5. Insurance</td><td>Public liability insurance</td><td>5 min</td></tr>
  <tr><td>6. Taste and film</td><td>Cook 2 signature dishes, we film and agree menus</td><td>2 to 3 hrs</td></tr>
  <tr><td>7. Go live</td><td>Sign the chef agreement and your profile goes live</td><td>10 min</td></tr></table>
  <p class="note" style="margin-top:10px">Need help with registration or training? <a target="_blank" rel="noopener" href="https://www.food.gov.uk/business-guidance/how-to-register-a-food-business">Register a food business (FSA)</a> · <a target="_blank" rel="noopener" href="https://www.food.gov.uk/business-guidance/allergen-guidance-for-food-businesses">Allergen guidance (FSA)</a></p>
  </div></section>`;
}
function privacy(){
  return `<section><div class="wrap" style="max-width:760px"><h1>Privacy (prototype)</h1>
  <p>This is a prototype. Requests you send are saved only in this browser and, if you choose, sent to ChefMii on WhatsApp. Nothing is stored on a server.</p>
  <p>When ChefMii launches: we collect only what we need to arrange your booking (name, WhatsApp number, event details). Allergy and dietary information is used only with your consent, shared only with your booked chef and deleted 30 days after your event. You can ask us to see or delete your data at any time.</p>
  <p>For chefs: we record that ID, food safety and insurance checks were done and their expiry dates. We do not keep copies of ID documents.</p>
  <p class="note">Contact: Jo, ChefMii founder, on <a href="https://wa.me/${WA}">WhatsApp</a>.</p></div></section>`;
}
const ST=['New','Contacted','Quoted','Booked','Lost'];
function admin(){
  const all=store.get();
  return `<section><div class="wrap"><h1>Founder view</h1><p class="note">Booking requests sent from this device. Prototype only: stored in this browser.</p>
  <div style="display:flex;gap:10px;flex-wrap:wrap;margin:12px 0"><button class="btn btn-o" onclick="exportCSV()">Export CSV</button><button class="btn btn-o" onclick="if(confirm('Delete all demo requests on this device?')){store.set([]);render()}">Clear demo data</button></div>
  ${all.length?`<div style="overflow-x:auto"><table><tr><th>Ref</th><th>Status</th><th>Event</th><th>Chef / menu</th><th>Host</th><th>Estimate</th></tr>
  ${all.map((r,i)=>`<tr><td>${r.id}<div class="note">${new Date(r.created).toLocaleString('en-GB')}</div></td>
   <td><select onchange="setStatus(${i},this.value)">${ST.map(s=>`<option ${s===r.status?'selected':''}>${s}</option>`).join('')}</select></td>
   <td>${esc(r.occasion)}<div class="note">${esc(r.date)} · ${r.guests} guests · ${esc(r.postcode)}</div>${r.dietary?`<div class="note" style="color:var(--coral-d)">ALLERGY CHECK: ${esc(r.dietary)}</div>`:''}</td>
   <td>${esc(r.chef)}<div class="note">${esc(r.menu)}</div></td>
   <td>${esc(r.name)}<div class="note"><a target="_blank" rel="noopener" href="https://wa.me/${esc(r.phone.replace(/\D/g,'').replace(/^0/,'44'))}">${esc(r.phone)}</a></div></td>
   <td>${r.estimate?money(r.estimate):'-'}</td></tr>`).join('')}</table></div>`:'<div class="empty">No requests yet. Try the <a href="#/request">request form</a>.</div>'}
  </div></section>`;
}
function setStatus(i,v){const a=store.get(); a[i].status=v; store.set(a);}
function exportCSV(){const a=store.get(); if(!a.length) return; const k=Object.keys(a[0]);
  const csv=[k.join(',')].concat(a.map(r=>k.map(x=>'"'+String(r[x]??'').replace(/"/g,'""')+'"').join(','))).join('\n');
  const b=new Blob([csv],{type:'text/csv'}); const l=document.createElement('a'); l.href=URL.createObjectURL(b); l.download='chefmii_requests.csv'; l.click();}

function render(){
  const h=location.hash.replace(/^#\/?/,''); const [path,qs]=h.split('?'); const parts=path.split('/'); const q=Object.fromEntries(new URLSearchParams(qs||''));
  let html, after;
  switch(parts[0]){
    case 'chefs': html=chefs(); break;
    case 'chef': html=chef(parts[1]); break;
    case 'request': html=requestPage(q); after=()=>bindRequest(q); break;
    case 'done': html=done(parts[1]); break;
    case 'join': html=join(); break;
    case 'privacy': html=privacy(); break;
    case 'admin': html=admin(); break;
    default: html=home();
  }
  $('#app').innerHTML=html; if(after) after();
  document.body.classList.toggle('has-sticky', parts[0]==='chef');
  document.querySelectorAll('.nav nav a').forEach(a=>a.classList.toggle('active',a.dataset.r===parts[0]));
  if(parts[0]!=='chefs') window.scrollTo(0,0);
}
window.addEventListener('hashchange',render); render();
</script>
</body>
</html>
