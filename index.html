<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ChefMii | Under construction</title>
<meta name="description" content="ChefMii is being rebuilt. Watch them cook, then book them. Back soon.">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Text:wght@700&family=Roboto:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root { --coral: #F04E37; --ink: #1C1C1E; --soft: #FFF3F0; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: Roboto, system-ui, -apple-system, "Segoe UI", sans-serif;
    color: var(--ink);
    background: var(--soft);
    display: flex; align-items: center; justify-content: center;
    padding: 24px;
  }
  main { text-align: center; max-width: 560px; }
  .logo {
    font-family: "Libre Caslon Text", Georgia, serif;
    font-size: clamp(44px, 9vw, 72px);
    color: var(--coral);
    letter-spacing: -1px;
  }
  .badge {
    display: inline-block; margin: 28px 0 18px;
    padding: 8px 18px; border-radius: 999px;
    background: var(--coral); color: #fff;
    font-weight: 500; font-size: 14px; letter-spacing: 1.5px; text-transform: uppercase;
  }
  h1 { font-size: clamp(24px, 5vw, 34px); font-weight: 500; line-height: 1.25; }
  p { margin-top: 14px; font-size: 17px; line-height: 1.6; color: #4a4a4f; }
  .tag { margin-top: 30px; font-family: "Libre Caslon Text", Georgia, serif; color: var(--coral); font-size: 18px; }
  footer { margin-top: 40px; font-size: 13px; color: #8a8a90; }
</style>
</head>
<body>
<main>
  <div class="logo">ChefMii</div>
  <div class="badge">Under construction</div>
  <h1>We're rebuilding ChefMii.</h1>
  <p>Discover private chefs from every corner of the world through short videos, then book them for your table. We'll be back soon.</p>
  <div class="tag">Watch them cook, then book them.</div>
  <footer>&copy; 2026 ChefMii</footer>
</main>
</body>
</html>
